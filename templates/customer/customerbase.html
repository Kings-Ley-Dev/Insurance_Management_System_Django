<!DOCTYPE html>{% load static %}<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer | Insurance Management</title><link rel="stylesheet" href="{% static 'css/app.css' %}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><button class="mobile-menu" type="button" aria-label="Open sidebar"><i class="fas fa-bars"></i></button><div class="sidebar-overlay"></div><aside class="sidebar"><a href="/customer/customer-dashboard" class="sidebar-brand"><span class="brand-mark"><i class="fas fa-shield-alt"></i></span> Insurance Portal</a><div class="profile-box"><img src="{% static customer.profile_pic.url %}" class="profile-image" alt="Profile"><div class="profile-name">{{request.user.first_name}}</div><p class="profile-role">Customer</p></div><nav class="sidebar-nav"><div class="sidebar-label">My Account</div><a href="/customer/customer-dashboard"><i class="fas fa-gauge-high"></i>Dashboard</a><a href="/customer/apply-policy"><i class="fas fa-file-circle-plus"></i>Apply Policy</a><a href="/customer/history"><i class="fas fa-clock-rotate-left"></i>History</a><a href="/customer/ask-question"><i class="fas fa-circle-question"></i>Ask Question</a><a href="/customer/question-history"><i class="fas fa-comments"></i>Question History</a></nav></aside><header class="app-topbar"><div class="top-title">Customer Portal</div><div class="top-spacer"></div><div class="user-chip"><i class="fas fa-circle-user"></i> {{request.user.first_name}}</div><a class="logout-link" href="/logout"><i class="fas fa-right-from-bracket"></i> Logout</a></header><main class="content"><div class="content-inner">{% block content %}{% endblock content %}</div></main><script src="{% static 'js/app.js' %}"></script></body></html>
