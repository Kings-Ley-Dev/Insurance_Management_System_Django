{% extends 'insurance/adminbase.html' %}{% block content %}<div class="page-header"><div><h1>Categories</h1><p>Organize policies by category.</p></div><a class="btn-modern btn-primary-modern" href="/admin-add-category"><i class="fas fa-plus"></i> Add Category</a></div><section class="panel-modern"><div class="table-wrap"><table class="modern-table"><thead><tr><th>#</th><th>Category</th><th>Created</th></tr></thead><tbody>{% for t in categories %}<tr><td>{{forloop.counter}}</td><td><strong>{{t.category_name}}</strong></td><td>{{t.creation_date}}</td></tr>{% empty %}<tr><td colspan="3"><div class="empty-state">No categories found.</div></td></tr>{% endfor}</tbody></table></div></section>{% endblock content %}
