{% extends 'insurance/adminbase.html' %}{% block content %}<div class="page-header"><div><h1>Delete Category</h1><p>Remove categories you no longer need.</p></div></div><section class="panel-modern"><div class="table-wrap"><table class="modern-table"><thead><tr><th>#</th><th>Category</th><th>Created</th><th>Action</th></tr></thead><tbody>{% for t in categories %}<tr><td>{{forloop.counter}}</td><td><strong>{{t.category_name}}</strong></td><td>{{t.creation_date}}</td><td><a class="btn-sm-modern btn-danger-modern" href="{% url 'delete-category' t.id %}"><i class="fas fa-trash"></i> Delete</a></td></tr>{% empty %}<tr><td colspan="4"><div class="empty-state">No categories found.</div></td></tr>{% endfor}</tbody></table></div></section>{% endblock content %}
