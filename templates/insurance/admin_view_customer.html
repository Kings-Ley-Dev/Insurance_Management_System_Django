{% load static %}
{% extends 'insurance/adminbase.html' %}{% block content %}<div class="page-header"><div><h1>Customers</h1><p>Review registered customer records.</p></div></div><section class="panel-modern"><div class="table-wrap"><table class="modern-table"><thead><tr><th>Name</th><th>Profile</th><th>Mobile</th><th>Address</th><th>Actions</th></tr></thead><tbody>{% for t in customers %}<tr><td><strong>{{t.get_name}}</strong></td><td><img src="{% static t.profile_pic.url %}" alt="Profile" style="width:42px;height:42px;border-radius:12px;object-fit:cover"></td><td>{{t.mobile}}</td><td>{{t.address}}</td><td><div class="table-actions"><a class="btn-sm-modern btn-primary-modern" href="{% url 'update-customer' t.id %}"><i class="fas fa-pen"></i> Edit</a><a class="btn-sm-modern btn-danger-modern" href="{% url 'delete-customer' t.id %}"><i class="fas fa-trash"></i> Delete</a></div></td></tr>{% empty %}<tr><td colspan="5"><div class="empty-state">No customers found.</div></td></tr>{% endfor}</tbody></table></div></section>{% endblock content %}
