{% extends 'insurance/adminbase.html' %}{% block content %}<div class="page-header"><div><h1>Update Category</h1><p>Select a category to edit.</p></div></div><section class="panel-modern"><div class="table-wrap"><table class="modern-table"><thead><tr><th>#</th><th>Category</th><th>Created</th><th>Action</th></tr></thead><tbody>{% for t in categories %}<tr><td>{{forloop.counter}}</td><td><strong>{{t.category_name}}</strong></td><td>{{t.creation_date}}</td><td><a class="btn-sm-modern btn-primary-modern" href="{% url 'update-category' t.id %}"><i class="fas fa-pen"></i> Edit</a></td></tr>{% empty %}<tr><td colspan="4"><div class="empty-state">No categories found.</div></td></tr>{% endfor}</tbody></table></div></section>{% endblock content %}
